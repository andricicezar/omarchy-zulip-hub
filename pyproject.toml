[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "omarchy-zulip-hub"
version = "2.7.1"
description = "Local Zulip event bridge for the Omarchy desktop"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Omarchy Zulip Hub contributors" }]
dependencies = []

[project.scripts]
zulip-hub = "zulip_hub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
